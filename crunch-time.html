#pad{display:none;width:100%;max-width:520px;height:150px;position:relative;flex:none}
body.touch #pad{display:block;position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));margin:0;pointer-events:none;z-index:1}
body.touch #pad .b{pointer-events:auto}
body.touch #app{justify-content:flex-start;padding-top:env(safe-area-inset-top)}
.b{position:absolute;border-radius:50%;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.2);color:rgba(255,255,255,.55);text-shadow:0 0 3px #000;font:bold 18px monospace;display:flex;align-items:center;justify-content:center;touch-action:none}
.b.on{background:rgba(255,255,255,.28);color:#fff}
/* movement stick: free to drag, but it only ever picks up, down, left or right */
#stick{position:absolute;border-radius:50%;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.18);touch-action:none;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);transition:transform .06s}
#stick.on #knob{background:rgba(255,255,255,.3);transition:none}
#stick .ar{position:absolute;font:12px monospace;color:rgba(255,255,255,.35);pointer-events:none}
/* phones held sideways: the picture fills the screen and the buttons float over it */
body.touch.land #app{justify-content:center;padding:0}
body.touch.land #pad{left:env(safe-area-inset-left);right:env(safe-area-inset-right);transform:none;width:auto;max-width:none}
#c2{display:none;image-rendering:pixelated;image-rendering:crisp-edges;background:#07070d;flex:none;border-top:2px solid #1c2040}
body.duo #c2{display:block}
body.duo #hint{display:none!important}
#hint{display:none;margin:auto 0;padding:0 24px;text-align:center;color:#7a86c8;font:13px monospace;line-height:1.5}
body.touch:not(.land) #hint{display:block}
#fs{display:none;position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;margin-left:-17px;width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.2);color:rgba(255,255,255,.55);font:bold 16px monospace;align-items:center;justify-content:center;z-index:2}
body.touch.canfs:not(.isfs) #fs{display:flex}
body.touch.land #fs{bottom:auto;top:max(6px,env(safe-area-inset-top))}

   wages (28-39) bass and kick come in and the motif plays plainly; the top (40-53) it climbs an octave over a snare roll

 if(j>=32)tone(mf(ch[j%4]+12),sd*.9,'square',.012,o);
 const l=TLEAD[j];if(l){tone(mf(l),sd*2.6,'sine',.07,o);tone(mf(l),sd*2,'sine',.022,o+sd*.75);if(j>=32)tone(mf(l-12),sd*1.8,'triangle',.03,o)}}

 const a=AC.createOscillator();a.type='sawtooth';a.frequency.value=mf(m);a.connect(f);a.start(s);a.stop(s+d+.03);
 if(grit){const b=AC.createOscillator();b.type='sawtooth';b.frequency.value=mf(m);b.detune.value=18;b.connect(f);b.start(s);b.stop(s+d+.03)}

/* Battle: pumping electronic, one step = a 16th. Party health drives it every step (smoothed):

   worn down = faster and heavier, darker chords (Am F G E), 16th hats, gritty bass;
